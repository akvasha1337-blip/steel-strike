; Steel Strike firmware
;   hub_esp32        ESP32 DevKit V1 hub for wireless targets (default build)
;   hub_esp32_wired  ESP32 DevKit V1 hub with 6 piezos + LEDs wired straight to it (Layout A)
;   hub_esp32s3      ESP32-S3 DevKitC hub, wired, up to 8 piezos
;   node_c3          ESP32-C3 SuperMini target node (one per plate)
;
; Build + flash:   pio run -e hub_esp32 -t upload
; Web app image:   pio run -e hub_esp32 -t uploadfs   (after `npm run build:fw` in ../web)

[platformio]
default_envs = hub_esp32, node_c3

[common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
  -DSS_FW_VERSION=\"1.0.0\"
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  adafruit/Adafruit NeoPixel@1.12.3

[hub_base]
platform = ${common.platform}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_src_filter = +<hub/> +<common/>
lib_deps =
  ${common.lib_deps}
  esp32async/ESPAsyncWebServer@3.6.2
  esp32async/AsyncTCP@3.3.2
  h2zero/NimBLE-Arduino@1.4.3

[env:hub_esp32]
extends = hub_base
board = esp32dev
build_flags = ${common.build_flags} -DSS_HUB -DSS_BOARD_DEVKIT -DSS_WIRED_TARGETS=0

[env:hub_esp32_wired]
extends = hub_base
board = esp32dev
build_flags = ${common.build_flags} -DSS_HUB -DSS_BOARD_DEVKIT -DSS_WIRED_TARGETS=6

[env:hub_esp32s3]
extends = hub_base
board = esp32-s3-devkitc-1
build_flags = ${common.build_flags} -DSS_HUB -DSS_BOARD_S3 -DSS_WIRED_TARGETS=8 -DARDUINO_USB_CDC_ON_BOOT=1

[env:node_c3]
platform = ${common.platform}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board = esp32-c3-devkitm-1
build_src_filter = +<node/> +<common/>
build_flags = ${common.build_flags} -DSS_NODE -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = ${common.lib_deps}
